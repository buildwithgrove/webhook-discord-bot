version: "1"
projects:
  - name: Grove API
    environments:
      - name: Production
        services:
          - type: web
            name: webhook-discord-bot-ruv6
            runtime: node
            repo: https://github.com/buildwithgrove/webhook-discord-bot
            plan: starter
            envVars:
              - key: DISCORD_CHANNEL_ID
                sync: false
              - key: DISCORD_TOKEN
                sync: false
              - key: RENDER_WEBHOOK_SECRET
                sync: false
              - key: RENDER_API_KEY
                sync: false
              - key: DISCORD_API_PROXY
                sync: false
            region: oregon
            buildCommand: pnpm install && pnpm run build
            startCommand: pnpm run start
            autoDeployTrigger: commit
